<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operaciones Básicas</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="container">
        <h1>Calculadora</h1>
        <p>Página simple de operaciones básicas</p>

        <form id="calculadoraForm">
            <label for="num1">Número 1:</label>
            <input type="number" id="num1" placeholder="ingresa un número" required>
            <br><br>
            <label for="num2">Número 2:</label>
            <input type="number" id="num2" placeholder="ingresa un número" required>
            <br><br>
            <select id="operacion" required>
                <option value="">Selecciona una operación</option>
                <option value="suma">Suma(+)</option>
                <option value="resta">Resta(-)</option>
                <option value="multiplicacion">Multiplicación(*)</option>
                <option value="division">División(/)</option>
            </select>
            <button type="submit">Calcular</button>
        </form>
        <div id="result">
        <!-- El resultado se mostrará aquí -->
        </div>
    </div>
    

</body>
</html>
